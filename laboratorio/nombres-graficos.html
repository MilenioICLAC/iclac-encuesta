<title>Nombres de los gráficos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;600&display=swap">
<style>
  /*
   * Dashboard de decisiones para los nombres de los gráficos de las historias.
   *
   * No es un laboratorio de composición: no se decide cómo se ve algo, se elige un texto entre tres
   * para cada figura. Por eso la tarjeta no tiene visor ni selector de ancho; tiene el titular de la
   * escena (para no repetirlo en el nombre), lo que la figura muestra, su texto equivalente actual y
   * un enlace a la historia en la app.
   *
   * **Nada de lo que se lee acá está inventado**: los titulares, las descripciones y los dos nombres
   * que ya existen salen de `src/historias/textos/*.tsx`, y las ubicaciones del código son reales.
   *
   * Dos decisiones por figura: el nombre (uno de tres, o uno escrito a mano) y el rótulo de eje, que
   * ocho figuras no tienen porque `BarrasDeEscena` no tiene la prop.
   */
  :root {
    color-scheme: light;
    --papel: #FBFAF7; --superficie: #FFFFFF; --tinta: #101917; --tinta-suave: #5F6D6A;
    --linea: #DFE4E2; --marca: #00A89C; --marca-oscura: #00776E;
    --ok: #1F7A4D; --ok-fondo: #E7F4EC; --pend: #8A5A00; --pend-fondo: #FFF4DB;
    --falta: #A3302A; --falta-fondo: #FBEAE8;
    --g500: #6B7280; --g600: #4B5563; --g700: #374151;
    --display: "Raleway", "Trebuchet MS", sans-serif;
    --cuerpo: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--papel); color: var(--tinta); font-family: var(--cuerpo); font-size: 15px; line-height: 1.5; overflow-x: hidden; }
  .envoltorio { max-width: 1100px; margin: 0 auto; padding: 20px 16px 64px; }
  header h1 { font-family: var(--display); font-size: 24px; font-weight: 600; margin: 0; text-wrap: balance; }
  header p { margin: 6px 0 0; color: var(--tinta-suave); font-size: 14px; max-width: 78ch; }
  header p + p { margin-top: 8px; }
  code { font-size: 12px; background: #F1F3F2; border-radius: 3px; padding: 1px 4px; }

  .tablero { position: sticky; top: 0; z-index: 5; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; margin: 16px -16px 0; padding: 10px 16px; background: rgba(251,250,247,.96); border-bottom: 1px solid var(--linea); font-size: 13px; }
  @media (max-width: 700px) { .tablero { position: static; } }
  .tablero .cuenta { font-variant-numeric: tabular-nums; color: var(--g700); }
  .tablero nav { display: flex; flex-wrap: wrap; gap: 6px; }
  .tablero nav a { color: var(--marca-oscura); text-decoration: none; border: 1px solid var(--linea); background: var(--superficie); border-radius: 999px; padding: 3px 10px; font-size: 12.5px; white-space: nowrap; }
  .tablero nav a .n { color: var(--pend); font-weight: 600; margin-left: 4px; }
  .accion { border: 1px solid var(--linea); background: var(--superficie); color: var(--tinta); border-radius: 999px; padding: 5px 12px; font: inherit; font-size: 12.5px; cursor: pointer; white-space: nowrap; }
  .accion:focus-visible, textarea:focus-visible, input:focus-visible, a:focus-visible, .opcion:focus-within { outline: 2px solid var(--marca-oscura); outline-offset: 2px; }

  section.seccion { margin-top: 28px; scroll-margin-top: 64px; }
  section.seccion > h2 { font-family: var(--display); font-size: 19px; font-weight: 600; margin: 0; }
  section.seccion > .bajada { margin: 4px 0 0; color: var(--tinta-suave); font-size: 13.5px; max-width: 80ch; }
  section.seccion > .bajada a { color: var(--marca-oscura); }

  article.figura { background: var(--superficie); border: 1px solid var(--linea); border-left: 3px solid var(--pend); border-radius: 10px; padding: 14px 16px; margin-top: 14px; scroll-margin-top: 64px; }
  article.figura[data-listo="si"] { border-left-color: var(--ok); }
  .cabeza { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px; }
  .cabeza h3 { font-family: var(--display); font-size: 16px; font-weight: 600; margin: 0; }
  .cabeza .donde { font-size: 12px; color: var(--g500); font-variant-numeric: tabular-nums; }
  .insignia { font-size: 11.5px; border-radius: 999px; padding: 2px 8px; white-space: nowrap; }
  .insignia.sin { background: var(--falta-fondo); color: var(--falta); }
  .insignia.con { background: var(--ok-fondo); color: var(--ok); }

  dl { margin: 10px 0 0; display: grid; grid-template-columns: 8.5rem minmax(0, 1fr); gap: 3px 12px; font-size: 13.5px; }
  @media (max-width: 620px) { dl { grid-template-columns: 1fr; gap: 0 0; } dl dt { margin-top: 8px; } }
  dt { color: var(--g500); }
  dd { margin: 0; color: var(--g700); }
  dd .titular { font-family: var(--display); font-weight: 600; color: var(--tinta); }
  dd.equivalente { color: var(--g600); font-size: 13px; }

  fieldset { border: 0; margin: 12px 0 0; padding: 0; }
  fieldset > legend { font-size: 12px; color: var(--g500); padding: 0; margin-bottom: 6px; text-transform: uppercase; letter-spacing: .04em; font-weight: 500; }
  .opciones { display: flex; flex-direction: column; gap: 6px; }
  .opcion { display: flex; align-items: flex-start; gap: 9px; border: 1px solid var(--linea); border-radius: 8px; padding: 8px 10px; cursor: pointer; }
  .opcion:has(input:checked) { border-color: var(--marca-oscura); background: #F2FBFA; }
  .opcion input { margin: 3px 0 0; accent-color: var(--marca-oscura); flex: 0 0 auto; }
  .opcion .texto { flex: 1 1 auto; min-width: 0; }
  /* El nombre se muestra como se vería en la figura: 11 px, versalitas, gris 500 (territorio.tsx:292).
     **Va suelta y no como `.opcion .comoSeVe`**: la vista previa la usa fuera de una opción, y como
     descendiente el rótulo salía a 15 px, o sea mostrando un tamaño que la app no tiene. */
  .comoSeVe { font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: .025em; color: var(--g500); }
  .opcion .angulo { font-size: 12px; color: var(--g600); margin-top: 2px; }
  /* Sueltas y no como `.opcion .largo`: la fila del eje las usa fuera de una opción, y como
     descendientes salían a 15 px y se comían una línea entera (visto en la captura de 900 px).
     **`flex: 0 1 auto` y `min-width: 0`, no `0 0 auto`:** el «hoy: …» del eje es un texto largo, y
     con `0 0` no encoge y estira el documento a 921 px en todos los anchos (medido). El `nowrap`
     queda solo donde el texto es corto de verdad, que es el contador de caracteres de cada opción. */
  .largo { font-size: 11.5px; color: var(--g500); font-variant-numeric: tabular-nums; flex: 0 1 auto; min-width: 0; }
  .opcion .largo { white-space: nowrap; flex: 0 0 auto; }
  .eje .largo { line-height: 1.35; overflow-wrap: anywhere; }
  .opcion .recomendado { font-size: 11px; color: var(--marca-oscura); font-weight: 600; margin-left: 6px; }
  .opcion input[type="text"] { width: 100%; border: 1px solid var(--linea); border-radius: 6px; padding: 5px 8px; font: inherit; font-size: 13px; }

  .eje { margin-top: 12px; border-top: 1px dashed var(--linea); padding-top: 10px; }
  .eje .fila { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .eje label.campo { flex: 1 1 260px; display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--g500); }
  .eje input[type="text"] { flex: 1 1 auto; min-width: 0; border: 1px solid var(--linea); border-radius: 6px; padding: 5px 8px; font: inherit; font-size: 13px; }

  /* La vista previa: el rótulo arriba y el eje abajo, con la figura de por medio como un bloque
     vacío. No dibuja los datos a propósito — lo que se decide acá es el texto, y una figura de
     mentira invita a discutir la figura. Las medidas son las de la app: 11 px versalitas gris 500
     para el rótulo (territorio.tsx:292) y 11 px gris 500 para el eje (Puntos.tsx:199-207). */
  .vista { margin-top: 12px; }
  .vista-titulo { margin: 0 0 6px; font-size: 12px; color: var(--g500); text-transform: uppercase; letter-spacing: .04em; font-weight: 500; }
  .vista-caja { border: 1px solid var(--linea); border-radius: 8px; padding: 10px 12px; background: #fff; }
  .vista-rotulo { margin: 0; }
  .vista-figura { margin: 8px 0; height: 54px; border-radius: 4px; background: repeating-linear-gradient(135deg, #F3F5F4, #F3F5F4 6px, #EAEEEC 6px, #EAEEEC 12px); display: flex; align-items: center; justify-content: center; font-size: 11.5px; color: var(--g500); }
  .vista-eje { margin: 0; font-size: 11px; line-height: 1.35; color: var(--g500); }
  .vista-aviso { margin: 6px 0 0; font-size: 12px; color: var(--pend); }

  .pie { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; margin-top: 12px; font-size: 12.5px; }
  .pie a { color: var(--marca-oscura); }
  textarea { width: 100%; margin-top: 10px; min-height: 52px; border: 1px solid var(--linea); border-radius: 8px; padding: 8px 10px; font: inherit; font-size: 13px; resize: vertical; background: var(--papel); }

  .bloque { background: var(--superficie); border: 1px solid var(--linea); border-radius: 10px; padding: 14px 16px; margin-top: 28px; }
  .bloque h2 { font-family: var(--display); font-size: 18px; font-weight: 600; margin: 0 0 6px; }
  .bloque p { margin: 0 0 8px; font-size: 13.5px; color: var(--g700); max-width: 80ch; }
  pre { background: #F7F8F8; border: 1px solid var(--linea); border-radius: 8px; padding: 10px; overflow: auto; max-height: 340px; font-size: 11.5px; }
  .copiado { font-size: 12.5px; color: var(--ok); }
</style>

    <pre id="json" hidden></pre>
  </div>
</div>

<script>
(() => {
  const CLAVE = 'lab-nombres-graficos-v1';
  const APP = 'http://localhost:5182/encuesta-percepciones';
  const $ = (id) => document.getElementById(id);
  const esc = (t) => String(t ?? '').replace(/[&<>"]/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));

  const SECCIONES = [
    { id: 'mirada', titulo: 'Historia 1 · La mirada', ruta: '/historias/mirada' },
    { id: 'entre-potencias', titulo: 'Historia 2 · Entre dos potencias', ruta: '/historias/entre-potencias' },
    { id: 'territorio', titulo: 'Historia 3 · Donde uno vive', ruta: '/historias/territorio' },
    { id: 'inversion', titulo: 'Historia 4 · Inversión y Estado', ruta: '/historias/inversion' },
    { id: 'china-cotidiana', titulo: 'Historia 5 · China cotidiana', ruta: '/historias/china-cotidiana' },
    { id: 'vacuna', titulo: 'Historia 6 · La vacuna', ruta: '/historias/vacuna' },
  ];

  // Los datos los escribe Claude desde el inventario verificado en el código. Se reemplaza entero.
  const FIGURAS = window.__FIGURAS__ || [];

  let estado = { elecciones: {}, nota: '' };
  try {
    const g = JSON.parse(localStorage.getItem(CLAVE) || 'null');
    // Leído por identificador y nunca por posición: una figura que ya no existe se ignora, y una
    // nueva arranca sin elegir.
    if (g && typeof g === 'object') {
      if (g.elecciones && typeof g.elecciones === 'object') {
        for (const [id, v] of Object.entries(g.elecciones)) {
          if (!v || typeof v !== 'object') continue;
          estado.elecciones[id] = {
            eleccion: typeof v.eleccion === 'number' || v.eleccion === 'otro' ? v.eleccion : null,
            propio: String(v.propio ?? ''),
            eje: String(v.eje ?? ''),
            comentario: String(v.comentario ?? ''),
          };
        }
      }
      if (typeof g.nota === 'string') estado.nota = g.nota;
    }
  } catch (e) { /* almacenamiento bloqueado o de una versión anterior */ }

  const guardar = () => { try { localStorage.setItem(CLAVE, JSON.stringify(estado)); } catch (e) { /* modo privado */ } };
  const de = (id) => estado.elecciones[id] || { eleccion: null, propio: '', eje: '', comentario: '' };
  const fijar = (id, cambio) => { estado.elecciones[id] = { ...de(id), ...cambio }; guardar(); };

  /** El nombre elegido, sea de la lista o escrito a mano. Vacío si todavía no hay decisión. */
  const nombreElegido = (f) => {
    const e = de(f.id);
    if (e.eleccion === 'otro') return e.propio.trim();
    if (typeof e.eleccion === 'number') return f.candidatos[e.eleccion]?.nombre ?? '';
    return '';
  };
  const listo = (f) => nombreElegido(f).length > 0;

  const pintar = () => {
    const main = $('secciones');
    main.innerHTML = '';
    for (const s of SECCIONES.filter((x) => FIGURAS.some((f) => f.historia === x.id))) {
      const sec = document.createElement('section');
      sec.className = 'seccion'; sec.id = `sec-${s.id}`;
      const suyas = FIGURAS.filter((f) => f.historia === s.id);
      sec.innerHTML = `<h2>${esc(s.titulo)}</h2><p class="bajada">${suyas.length} ${suyas.length === 1 ? 'figura' : 'figuras'}. <a href="${APP}${s.ruta}" target="_blank" rel="noopener">Abrir la historia en la app</a></p>`;
      for (const f of suyas) sec.appendChild(tarjeta(f));
      main.appendChild(sec);
    }
    contar();
  };

  const tarjeta = (f) => {
    const e = de(f.id);
    const art = document.createElement('article');
    art.className = 'figura'; art.id = `f-${f.id}`;
    art.dataset.listo = listo(f) ? 'si' : 'no';

    const insignia = f.nombrado
      ? `<span class="insignia con">ya tiene nombre</span>`
      : `<span class="insignia sin">sin nombre</span>`;
    const insigniaEje = f.eje.tiene
      ? `<span class="insignia con">eje declarado</span>`
      : `<span class="insignia sin">sin rótulo de eje</span>`;

    const opciones = f.candidatos.map((c, i) => `
      <label class="opcion">
        <input type="radio" name="n-${esc(f.id)}" value="${i}" ${e.eleccion === i ? 'checked' : ''}>
        <span class="texto">
          <span class="comoSeVe">${esc(c.nombre)}</span>${f.recomendado === i ? '<span class="recomendado">recomendado</span>' : ''}
          <span class="angulo">${esc(c.angulo)}</span>
        </span>
        <span class="largo">${c.nombre.length} car.</span>
      </label>`).join('');

    art.innerHTML = `
      <div class="cabeza">
        <h3>${esc(f.titulo)}</h3>
        <span class="donde">escena ${f.escena} · ${esc(f.componente)} · ${esc(f.ubicacion)}</span>
        ${insignia} ${insigniaEje}
      </div>
      <dl>
        <dt>Titular de la escena</dt><dd><span class="titular">${esc(f.titularEscena)}</span></dd>
        <dt>Qué muestra</dt><dd>${esc(f.muestra)}</dd>
        <dt>Unidad y base</dt><dd>${esc(f.unidadBase)}</dd>
        ${f.cambiaEntrePasos ? `<dt>Ojo</dt><dd>${esc(f.cambiaEntrePasos)}</dd>` : ''}
        ${f.nombreActual ? `<dt>Nombre de hoy</dt><dd><span class="comoSeVe">${esc(f.nombreActual)}</span></dd>` : ''}
        <dt>Texto equivalente</dt><dd class="equivalente">${esc(f.descripcion)}</dd>
      </dl>

      <fieldset>
        <legend>Nombre del gráfico — elige uno</legend>
        <div class="opciones">
          ${opciones}
          <label class="opcion">
            <input type="radio" name="n-${esc(f.id)}" value="otro" ${e.eleccion === 'otro' ? 'checked' : ''}>
            <span class="texto">
              <input type="text" class="propio" placeholder="Escribir otro" value="${esc(e.propio)}">
              <span class="angulo">El tuyo, si ninguno sirve.</span>
            </span>
            <span class="largo cuenta-propio">${e.propio.length} car.</span>
          </label>
        </div>
      </fieldset>

      <div class="eje">
        <div class="fila">
          <label class="campo">Rótulo de eje
            <input type="text" class="campo-eje" value="${esc(e.eje || f.eje.propuesta || f.eje.actual || '')}">
          </label>
          ${f.eje.tiene ? `<span class="largo">hoy: ${esc(f.eje.actual)}</span>` : `<span class="largo">hoy no tiene</span>`}
        </div>
        ${f.eje.porQue ? `<p class="angulo" style="margin:6px 0 0;color:var(--g600);font-size:12px">${esc(f.eje.porQue)}</p>` : ''}
      </div>

      <div class="vista">
        <p class="vista-titulo">Cómo queda la figura</p>
        <div class="vista-caja">
          <p class="comoSeVe vista-rotulo">—</p>
          <div class="vista-figura" aria-hidden>la figura</div>
          <p class="vista-eje">—</p>
        </div>
        <p class="vista-aviso" hidden></p>
      </div>

      <div class="pie">
        <a href="${APP}/historias/${esc(f.historia)}" target="_blank" rel="noopener">Ver la historia</a>
        <span style="color:var(--g500)">Se escribe en ${esc(f.dondeVive)}</span>
      </div>
      <textarea aria-label="Comentario" placeholder="Comentario (opcional)">${esc(e.comentario)}</textarea>`;

    const refrescar = () => {
      art.dataset.listo = listo(f) ? 'si' : 'no';
      // **El rótulo y el eje se miran juntos.** Con el criterio de Felipe los dos hablan de la base
      // (el nombre dice la medida y su base; el eje, la unidad y el N), así que la redundancia es un
      // riesgo real y solo se ve mirando las dos líneas en su lugar.
      const nombre = nombreElegido(f);
      const eje = (de(f.id).eje || f.eje.propuesta || f.eje.actual || '').trim();
      art.querySelector('.vista-rotulo').textContent = nombre || '(sin nombre)';
      art.querySelector('.vista-eje').textContent = eje || '(sin rótulo de eje)';
      // Palabras de cuatro letras o más que aparecen en los dos, ignorando tildes y mayúsculas.
      // Las funcionales quedan fuera: «cada» repetido no es redundancia, y un aviso que salta por
      // eso deja de leerse, que es el mismo defecto que un validador que grita sobre datos sanos.
      const VACIAS = new Set(['cada', 'para', 'como', 'mismo', 'misma', 'segun', 'esta', 'este', 'sino', 'pero']);
      const normal = (s) => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
      const palabras = (s) => new Set((normal(s).match(/[a-z]{4,}/g) || []).filter((w) => !VACIAS.has(w)));
      const enEje = palabras(eje);
      const repetidas = [...palabras(nombre)].filter((w) => enEje.has(w));
      const aviso = art.querySelector('.vista-aviso');
      aviso.hidden = repetidas.length === 0;
      aviso.textContent = repetidas.length ? `Se repite entre el nombre y el eje: ${repetidas.join(', ')}.` : '';
      contar();
    };
    art.querySelectorAll(`input[name="n-${f.id}"]`).forEach((r) => r.addEventListener('change', () => {
      fijar(f.id, { eleccion: r.value === 'otro' ? 'otro' : Number(r.value) });
      refrescar();
    }));
    const propio = art.querySelector('.propio');
    propio.addEventListener('input', (ev) => {
      const radio = art.querySelector(`input[name="n-${f.id}"][value="otro"]`);
      radio.checked = true;
      fijar(f.id, { eleccion: 'otro', propio: ev.target.value });
      art.querySelector('.cuenta-propio').textContent = `${ev.target.value.length} car.`;
      refrescar();
    });
    art.querySelector('.campo-eje').addEventListener('input', (ev) => { fijar(f.id, { eje: ev.target.value }); refrescar(); });
    art.querySelector('textarea').addEventListener('input', (ev) => { fijar(f.id, { comentario: ev.target.value }); });
    refrescar();
    return art;
  };

  const contar = () => {
    const hechas = FIGURAS.filter(listo).length;
    $('cuenta').textContent = `${FIGURAS.length - hechas} sin elegir · ${hechas} elegidas, de ${FIGURAS.length}`;
    $('indice').innerHTML = SECCIONES.filter((x) => FIGURAS.some((f) => f.historia === x.id)).map((s) => {
      const n = FIGURAS.filter((f) => f.historia === s.id && !listo(f)).length;
      return `<a href="#sec-${s.id}">${esc(s.titulo.replace(/^Historia \d · /, ''))}${n ? `<span class="n">${n}</span>` : ''}</a>`;
    }).join('');
  };

  $('nota').value = estado.nota;
  $('nota').addEventListener('input', (e) => { estado.nota = e.target.value; guardar(); });
  $('ir-exportar').addEventListener('click', () => $('bloque-exportar').scrollIntoView({ behavior: 'smooth' }));
  $('tomar-todo').addEventListener('click', () => {
    // Atajo para arrancar: pone el recomendado en todas las que no tienen elección, y no pisa las
    // que ya elegiste.
    for (const f of FIGURAS) if (de(f.id).eleccion === null) fijar(f.id, { eleccion: f.recomendado });
    pintar();
  });
  $('limpiar').addEventListener('click', () => {
    if (!confirm('¿Borrar todas tus respuestas de este navegador?')) return;
    estado = { elecciones: {}, nota: '' }; guardar(); $('nota').value = ''; pintar();
  });
  $('exportar').addEventListener('click', () => {
    const texto = JSON.stringify({
      laboratorio: 'nombres-graficos',
      fecha: new Date().toISOString(),
      figuras: FIGURAS.map((f) => {
        const e = de(f.id);
        return {
          id: f.id,
          historia: f.historia,
          escena: f.escena,
          nombre: nombreElegido(f) || null,
          deLaLista: typeof e.eleccion === 'number' ? e.eleccion : null,
          eje: (e.eje || f.eje.propuesta || f.eje.actual || '').trim() || null,
          ejeCambia: (e.eje || '').trim() !== '' && (e.eje || '').trim() !== (f.eje.actual || ''),
          comentario: e.comentario,
        };
      }),
      nota: estado.nota,
    }, null, 2);
    const pre = $('json');
    const aMano = () => { pre.hidden = false; pre.textContent = texto; $('copiado').textContent = 'No se pudo copiar: selecciona el texto de abajo.'; };
    if (navigator.clipboard) navigator.clipboard.writeText(texto).then(() => { $('copiado').textContent = 'Copiado. Pégalo en el chat.'; pre.hidden = false; pre.textContent = texto; }, aMano);
    else aMano();
  });

  const sinNombre = FIGURAS.filter((f) => !f.nombrado).length;
  const sinEje = FIGURAS.filter((f) => !f.eje.tiene && !f.eje.noAplica).length;
  $('intro').textContent = `${FIGURAS.length} figuras en las seis historias. ${sinNombre} no tienen nombre y ${sinEje} no declaran la unidad de su eje. Para cada una hay tres candidatos; elige uno o escribe el tuyo.`;
  $('intro2').innerHTML = 'El nombre es el rótulo de 11 px en versalitas que va encima de la figura, como <span class="comoSeVe">Exposición económica a China</span> en «Donde uno vive». No repite el titular de la escena: el titular dice qué significa, el nombre dice qué se está viendo. Las opciones se muestran tal como se verían en la figura.';

  pintar();
})();
</script>
